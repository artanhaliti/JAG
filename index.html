<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event Time Splitter</title>
<style>
:root{--bg:#eef2ef;--card:#fff;--panel:#f4f7f5;--ink:#1c2420;--mute:#5d6862;--line:#d3dbd6;--accent:#0e7f63;--accent-ink:#fff;--err:#a3261b;--hi:#e3f1ec;--shadow:0 1px 2px rgba(20,40,30,.06),0 8px 24px rgba(20,40,30,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101613;--card:#1a221e;--panel:#141b18;--ink:#e8eeea;--mute:#9aa8a0;--line:#33403a;--accent:#4fb894;--accent-ink:#0b1510;--err:#ff8a7d;--hi:#24332c;--shadow:0 8px 24px rgba(0,0,0,.4);color-scheme:dark}
:root:not([data-theme="light"]) .logo{background:#fff;padding:8px 16px}}
:root[data-theme="dark"]{--bg:#101613;--card:#1a221e;--panel:#141b18;--ink:#e8eeea;--mute:#9aa8a0;--line:#33403a;--accent:#4fb894;--accent-ink:#0b1510;--err:#ff8a7d;--hi:#24332c;--shadow:0 8px 24px rgba(0,0,0,.4);color-scheme:dark}
:root[data-theme="dark"] .logo{background:#fff;padding:8px 16px}
:root{--rbg:#fdf0ee;--rink:#b3261e;--rline:#f6d0cc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rbg:#3a2322;--rink:#ff9d92;--rline:#5a3532}}
:root[data-theme="dark"]{--rbg:#3a2322;--rink:#ff9d92;--rline:#5a3532}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:740px;margin:0 auto;padding:28px 16px 56px}
.logo{display:block;width:max-content;max-width:100%;margin:0 auto 14px;border-radius:10px;line-height:0}
.logo img{height:100px;width:auto;max-width:100%}
h1{font-size:1.6rem;text-align:center;margin:0 0 4px;letter-spacing:-.01em}
p.sub{text-align:center;margin:0 0 24px;color:var(--mute)}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:1.5fr auto auto 44px;gap:14px;align-items:end;padding:14px 14px 32px;margin-bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
label{display:block;font-size:.85rem;font-weight:600;color:var(--mute);margin-bottom:4px}
input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:0 10px;height:44px;width:100%}
input::placeholder{color:var(--mute);opacity:.7}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pair{position:relative;display:flex;align-items:center;gap:6px}
.pair input{width:58px;text-align:center;cursor:pointer}
.pair input.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--hi)}
.colon{color:var(--mute);font-weight:600}
.tf{position:relative}
.ap{position:absolute;left:0;top:100%;white-space:nowrap;font-size:.8rem;color:var(--accent);font-weight:600;margin-top:3px}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:grid;grid-auto-flow:column;max-width:calc(100vw - 16px)}
.pop.hours{grid-template-rows:repeat(12,auto);grid-template-columns:repeat(2,auto);column-gap:4px}
.pop.mins{grid-template-rows:repeat(10,auto);grid-template-columns:repeat(6,auto);column-gap:2px}
.pop button{border:0;background:transparent;border-radius:6px;padding:5px 12px;text-align:left;font-size:.92rem;color:var(--ink);white-space:nowrap}
.pop.mins button{text-align:center;padding:5px 9px}
.pop button:hover{background:var(--hi)}
.pop button.sel{background:var(--accent);color:var(--accent-ink);font-weight:600}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.rm{width:44px;height:44px;border-radius:8px;border:1px solid var(--rline);background:var(--rbg);color:var(--rink);font-size:1.3rem;line-height:1;padding:0}
.rm:hover,.btn.clear:hover{filter:brightness(.96)}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{border-radius:10px;padding:11px 18px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);padding:11px 32px}
.left{display:flex;gap:10px;flex-wrap:wrap}
.btn.clear{background:var(--rbg);color:var(--rink);border-color:var(--rline)}
#msg{color:var(--err);margin-top:10px;min-height:1.2em;font-size:.95rem}
#out{margin-top:22px}
.res{border-radius:14px;background:var(--card);box-shadow:var(--shadow);margin-bottom:12px;padding:14px 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top b{font-size:1.7rem;white-space:nowrap;color:var(--accent)}
.top small{color:var(--mute);display:block}
.tg{background:none;border:0;padding:4px 0;margin-top:4px;color:var(--accent);text-decoration:underline;font-size:.92rem}
.det{margin-top:8px}
.seg{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;padding:7px 0;border-top:1px solid var(--line)}
.seg span:last-child{text-align:right;white-space:nowrap}
.tag{font-weight:600}
.sum{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;padding-top:8px;border-top:1px solid var(--line);font-size:.9rem;color:var(--mute)}
.total{display:flex;justify-content:space-between;padding:10px 16px;color:var(--mute)}
@media (pointer:coarse){.pop button{padding:9px 12px}.pop.mins button{padding:9px 10px}.tg{padding:10px 0}}
@media (max-width:600px){
main{padding:20px 12px 40px}
.card{padding:12px}
h1{font-size:1.4rem}.logo img{height:84px}
p.sub{font-size:.92rem}
.row{position:relative;grid-template-columns:1fr 1fr;padding:12px 12px 32px;gap:12px}
.row>.cn{grid-column:1/-1;padding-right:54px}
.row .rm{position:absolute;top:37px;right:12px}
.pair input{width:auto;flex:1;min-width:0}
.pop{position:fixed;left:0!important;right:0;bottom:0;top:auto;max-width:none;max-height:72vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.pop.hours{grid-template-columns:repeat(2,1fr);column-gap:8px}
.pop.mins{grid-template-columns:repeat(6,1fr);column-gap:4px}
.pop button,.pop.mins button{padding:9px 4px;font-size:1rem;text-align:center}
.actions{flex-direction:column-reverse}
.btn.primary{width:100%}
.left .btn{flex:1}
.seg{flex-direction:column;gap:2px}
.seg span:last-child{text-align:left;white-space:normal}
}
</style>
</head>

<h1>Event Time Splitter</h1>
<p class="sub">Enter the claims you worked on. Time that overlaps will be split evenly among the claims.</p>
<div class="card">
<div id="rows"></div>
<div class="actions">
<div class="left"><button type="button" class="btn" id="add">Add another claim</button><button type="button" class="btn clear" id="clear">Clear all</button></div>
<button type="button" class="btn primary" id="calc">Calculate</button>
</div>
<div id="msg" role="alert"></div>
</div>
<div id="out" aria-live="polite"></div>
</main>
<script>
const rowsEl=document.getElementById('rows'),msg=document.getElementById('msg'),out=document.getElementById('out');
const pad=n=>String(n).padStart(2,'0');
const h12=h=>(h%12||12)+(h>=12?'pm':'am');
const clock=m=>{let h=Math.floor(m/60),mi=m%60;return (h%12||12)+':'+pad(mi)+' '+(h>=12?'PM':'AM');};
const fmt=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?h+' hr '+r+' min':r+' min';};
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
/* ---- hh : mm time field ---- */
let pop=null;
function closePop(){if(pop){pop.remove();pop=null;}document.querySelectorAll('.pair input.on').forEach(i=>i.classList.remove('on'));}
function place(p){
  const r=p.getBoundingClientRect(),vw=document.documentElement.clientWidth;
  if(r.right>vw-8)p.style.left=(vw-8-r.right)+'px';
}
function refresh(w){
  const h=w.querySelector('.hh').value,m=w.querySelector('.mm').value;
  w.querySelector('.ap').textContent=(h!==''&&m!=='')?clock(+h*60+ +m):'';
}
function openPop(w,kind){
  const inp=w.querySelector(kind==='h'?'.hh':'.mm'),pair=w.querySelector('.pair');
  if(pop&&pop._inp===inp)return;
  closePop();inp.classList.add('on');
  const hh=w.querySelector('.hh'),mm=w.querySelector('.mm');
  const p=el('div','pop '+(kind==='h'?'hours':'mins'));p._inp=inp;
  if(kind==='h'){
    for(let h=0;h<24;h++){
      const b=el('button',hh.value!==''&&+hh.value===h?'sel':'',pad(h)+' - '+h12(h));b.type='button';
      b.onclick=()=>{hh.value=pad(h);if(mm.value==='')mm.value='00';refresh(w);closePop();openPop(w,'m');mm.focus({preventScroll:true});};
      p.appendChild(b);
    }
  }else{
    for(let m=0;m<60;m++){
      const b=el('button',mm.value!==''&&+mm.value===m?'sel':'',pad(m));b.type='button';
      b.onclick=()=>{
        mm.value=pad(m);refresh(w);closePop();
        if(w.classList.contains('st')){const e=w.closest('.row').querySelector('.en');openPop(e,'h');e.querySelector('.hh').focus({preventScroll:true});}
      };
      p.appendChild(b);
    }
  }
  pair.appendChild(p);pop=p;place(p);
}
function timeField(cls,lbl){
  const w=el('div','tf '+cls);
  const l=el('label',null,lbl);
  const pair=el('div','pair');
  const mk=(c,ph)=>{const i=el('input',c);i.type='text';i.placeholder=ph;i.autocomplete='off';i.inputMode='none';i.maxLength=2;i.setAttribute('aria-label',lbl+(c==='hh'?' hour':' minute'));return i;};
  const hh=mk('hh','hh'),mm=mk('mm','mm');
  pair.append(hh,el('span','colon',':'),mm);
  w.append(l,pair,el('span','ap'));
  [[hh,'h',23],[mm,'m',59]].forEach(([i,k,max])=>{
    i.addEventListener('focus',()=>openPop(w,k));
    i.addEventListener('click',()=>openPop(w,k));
    i.addEventListener('keydown',e=>{if(e.key==='Escape')closePop();});
    i.addEventListener('input',()=>{
      i.value=i.value.replace(/\D/g,'').slice(0,2);refresh(w);
      if(k==='h'&&i.value.length===2&&+i.value<=23){if(mm.value==='')mm.value='00';refresh(w);closePop();mm.focus({preventScroll:true});}
    });
    i.addEventListener('blur',()=>{
      if(i.value==='')return;
      if(+i.value>max){msg.textContent=(k==='h'?'Hours go from 00 to 23.':'Minutes go from 00 to 59.');i.value='';}
      else i.value=pad(+i.value);
      refresh(w);
    });
  });
  return w;
}
function addRow(){
  const d=el('div','row');
  const c=el('div','cn');
  c.innerHTML='<label>Claim number or name</label><input class="c" type="text" autocomplete="off" placeholder="e.g. 000000-000000-WC-01 - Doe, John">';
  const rm=el('button','rm','×');rm.type='button';rm.setAttribute('aria-label','Remove claim');
  rm.onclick=()=>{if(rowsEl.children.length>1){closePop();d.remove();}};
  d.append(c,timeField('st','Start'),timeField('en','End'),rm);
  rowsEl.appendChild(d);
}
document.addEventListener('mousedown',e=>{if(pop&&!pop.parentNode.contains(e.target))closePop();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop();});
function readT(w){
  const h=w.querySelector('.hh').value,mi=w.querySelector('.mm');
  if(h==='')return null;
  if(mi.value===''){mi.value='00';refresh(w);}
  return +h*60+ +mi.value;
}
/* ---- calculation ---- */
function calc(){
  closePop();msg.textContent='';out.innerHTML='';
  const ev=[];
  for(const r of rowsEl.querySelectorAll('.row')){
    const name=r.querySelector('.c').value.trim();
    const s=readT(r.querySelector('.st')),e=readT(r.querySelector('.en'));
    if(!name&&s===null&&e===null)continue;
    if(!name||s===null||e===null){msg.textContent='Each claim needs a name or number, a start time and an end time.';return;}
    if(e<=s){msg.textContent='The end time for "'+name+'" must be after its start time.';return;}
    ev.push({name,s,e,mins:0,alone:0,shared:0,segs:[]});
  }
  if(!ev.length){msg.textContent='Add at least one claim.';return;}
  const pts=[...new Set(ev.flatMap(x=>[x.s,x.e]))].sort((a,b)=>a-b);
  const segs=[];
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1];
    const act=ev.map((x,k)=>x.s<=a&&x.e>=b?k:-1).filter(k=>k>=0);
    if(!act.length)continue;
    const key=act.join(','),last=segs[segs.length-1];
    if(last&&last.key===key&&last.b===a)last.b=b;else segs.push({a,b,key,act});
  }
  segs.forEach(sg=>{
    const len=sg.b-sg.a,n=sg.act.length;
    sg.act.forEach(k=>{
      const x=ev[k],share=len/n;
      x.mins+=share;
      if(n===1)x.alone+=len;else x.shared+=share;
      x.segs.push({a:sg.a,b:sg.b,len,share,others:sg.act.filter(o=>o!==k).map(o=>ev[o].name)});
    });
  });
  let total=0;
  ev.forEach(x=>{x.tenths=Math.ceil(x.mins/6-1e-9);total+=x.tenths;});
  ev.forEach(x=>{
    const d=el('div','res');
    const top=el('div','top'),l=el('div');
    l.append(el('strong',null,x.name),el('small',null,clock(x.s)+' to '+clock(x.e)));
    top.append(l,el('b',null,(x.tenths/10).toFixed(1)+' hrs'));
    d.appendChild(top);
    const tg=el('button','tg','Details');tg.type='button';tg.setAttribute('aria-expanded','false');
    const det=el('div','det');det.hidden=true;
    tg.onclick=()=>{det.hidden=!det.hidden;tg.setAttribute('aria-expanded',String(!det.hidden));tg.textContent=det.hidden?'Details':'Hide details';};
    x.segs.forEach(sg=>{
      const r=el('div','seg'),a=el('span');
      a.append(el('span','tag',sg.others.length?'Shared':'Unshared'),document.createTextNode(' '+clock(sg.a)+' to '+clock(sg.b)+(sg.others.length?' with '+sg.others.join(', '):'')));
      r.append(a,el('span',null,sg.others.length?fmt(sg.len)+' ÷ '+(sg.others.length+1)+' = '+fmt(sg.share):fmt(sg.len)));
      det.appendChild(r);
    });
    const sum=el('div','sum');
    sum.append(el('span',null,'Unshared: '+fmt(x.alone)),el('span',null,'Shared time: '+fmt(x.shared)),el('span',null,'Total: '+fmt(x.mins)));
    det.appendChild(sum);
    d.append(tg,det);out.appendChild(d);
  });
  const t=el('div','total');
  t.append(el('span',null,'Total billed'),el('span',null,(total/10).toFixed(1)+' hrs'));
  out.appendChild(t);
}
document.getElementById('add').onclick=addRow;
document.getElementById('clear').onclick=()=>{closePop();rowsEl.innerHTML='';out.innerHTML='';msg.textContent='';addRow();addRow();};
document.getElementById('calc').onclick=calc;
addRow();addRow();
</script>
